name: Build and verify

on:
  push:
    branches:
      - Main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMNI_RUST_VERSION: "1.97.1"
  OMNI_JDK_VERSION: "25"
  OMNI_NDK_VERSION: "29.0.14206865"
  OMNI_BUILD_TOOLS_VERSION: "36.0.0"
  OMNI_ANDROID_API: "36"
  OMNI_CMAKE_VERSION: "4.4.2"
  OMNI_CMAKE_SHA256: "3ada9a3f5d8a85413579bdd0ea6aa8e8da86efdd6d15c91a1afa517f2021956c"
  OMNI_SDK_CMAKE_FOR_NINJA: "4.1.2"

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.OMNI_JDK_VERSION }}

      - name: Install the pinned build tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"
          "$sdkmanager" "build-tools;$OMNI_BUILD_TOOLS_VERSION"
          test -x "$ANDROID_HOME/build-tools/$OMNI_BUILD_TOOLS_VERSION/apksigner"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$OMNI_RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$OMNI_RUST_VERSION"
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$OMNI_RUST_VERSION"

      - name: Run every check that needs no Android SDK
        run: ./Builder_Test.py --strict layout format lint dependencies strings core

  apk:
    name: Builder APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.OMNI_JDK_VERSION }}

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$OMNI_RUST_VERSION" --profile minimal
          rustup default "$OMNI_RUST_VERSION"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          rustc --version

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"

          "$sdkmanager" \
            "platforms;android-$OMNI_ANDROID_API" \
            "build-tools;$OMNI_BUILD_TOOLS_VERSION" \
            "ndk;$OMNI_NDK_VERSION" \
            "cmake;$OMNI_SDK_CMAKE_FOR_NINJA"

          test -d "$ANDROID_HOME/ndk/$OMNI_NDK_VERSION"

      - name: Provision the pinned CMake from upstream
        run: |
          set -euo pipefail
          archive="cmake-$OMNI_CMAKE_VERSION-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v$OMNI_CMAKE_VERSION/$archive"

          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "$OMNI_CMAKE_SHA256  $archive" | sha256sum --check --strict

          install --directory "$HOME/cmake-$OMNI_CMAKE_VERSION"
          tar --extract --gzip --file "$archive" \
            --directory "$HOME/cmake-$OMNI_CMAKE_VERSION" --strip-components=1

          cp "$ANDROID_HOME/cmake/$OMNI_SDK_CMAKE_FOR_NINJA/bin/ninja" \
             "$HOME/cmake-$OMNI_CMAKE_VERSION/bin/ninja"

          reported=$("$HOME/cmake-$OMNI_CMAKE_VERSION/bin/cmake" --version | head -1)
          echo "$reported"
          test "$reported" = "cmake version $OMNI_CMAKE_VERSION"

      - name: Point the build at the provisioned toolchains
        env:
          OMNI_SIGNING_CERT_SHA256: ${{ secrets.OMNI_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$HOME/cmake-$OMNI_CMAKE_VERSION"
          } > local.properties
          cat local.properties

      - name: Provision the release signing key
        env:
          OMNI_KEYSTORE_BASE64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OMNI_KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets are configured."
            echo "The release APK will be built unsigned and cannot be installed."
            echo "Add OMNI_KEYSTORE_BASE64, OMNI_KEYSTORE_PASSWORD, OMNI_KEY_ALIAS"
            echo "and OMNI_KEY_PASSWORD as repository secrets to change that."
            exit 0
          fi

          store="$RUNNER_TEMP/omni-release.jks"

          printf '%s' "$OMNI_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^=*//' \
            | base64 --decode > "$store"
          test -s "$store"

          if ! keytool -list -keystore "$store" \
                -storepass "$OMNI_KEYSTORE_PASSWORD" \
                -alias "$OMNI_KEY_ALIAS" > /dev/null 2>&1; then
            decoded=$(wc -c < "$store")
            echo "OMNI_KEYSTORE_BASE64 did not decode into a usable keystore."
            echo
            echo "It decoded to $decoded bytes, which narrows it down:"
            echo
            echo "  Right size, still refused -> a character in the secret was"
            echo "  altered in transit. One is enough, and the result decodes to"
            echo "  the correct length, so size proves nothing. Re-copy the whole"
            echo "  value from the file it was delivered in rather than hunting"
            echo "  for the character."
            echo
            echo "  Wrong size -> the copy was partial, or it picked up text"
            echo "  around the value. A partial copy decodes without complaint."
            echo
            echo "  Either way, also confirm OMNI_KEYSTORE_PASSWORD and"
            echo "  OMNI_KEY_ALIAS belong to this key."
            exit 1
          fi

          keytool -list -keystore "$store" \
            -storepass "$OMNI_KEYSTORE_PASSWORD" \
            -alias "$OMNI_KEY_ALIAS" 2>/dev/null | grep -i "fingerprint" || true

          {
            echo "OMNI_SIGNING_STORE_FILE=$store"
            echo "OMNI_SIGNING_STORE_PASSWORD=$OMNI_KEYSTORE_PASSWORD"
            echo "OMNI_SIGNING_KEY_ALIAS=$OMNI_KEY_ALIAS"
            echo "OMNI_SIGNING_KEY_PASSWORD=$OMNI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing is configured."

      - name: Verify the provisioned CMake
        run: ./gradlew :Builder:verifyCmakeToolchain --console=plain

      - name: Verify the toolchain lock
        run: ./gradlew verifyToolchainLock --console=plain

      - name: Verify the Kotlin toolchain
        run: ./gradlew :Builder:verifyKotlinToolchain --console=plain

      - name: Run every check
        run: ./Builder_Test.py --strict --all

      - name: Report what the release artifact is
        run: |
          set -euo pipefail
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          echo "Release artifact: $(basename "$apk")"
          echo "SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/$OMNI_BUILD_TOOLS_VERSION/apksigner" verify \
            --print-certs "$apk" || {
              echo
              echo "This artifact is NOT signed and cannot be installed."
              echo "Add the OMNI_KEYSTORE_* repository secrets to get a signed one."
            }

      - name: Publish the release APK
        uses: actions/upload-artifact@v5
        with:
          name: omni-builder-release
          path: |
            Builder/build/outputs/apk/release/*.apk
            Builder/build/outputs/bundle/release/*.aab
          if-no-files-found: error
