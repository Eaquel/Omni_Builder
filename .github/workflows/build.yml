# Omni_Builder — build and verification workflow
#
# WHY THIS FILE EXISTS
# -----------------------------------------------------------------------------
# Directive section 46 does not define a location for continuous integration, but
# section 51 makes "tests pass", "determinism verified" and "no unresolved
# critical TODO" gates that something has to actually run. This workflow is that
# something. It is deliberately the only file outside the layout of section 46
# besides the Rust manifest and crate root.
#
# WHAT IT PROVES
# -----------------------------------------------------------------------------
#   1. The Core compiles on the exact pinned Rust version, with no warnings.
#   2. The Core's tests pass.
#   3. The Gradle pins and the Core's toolchain lock agree.
#   4. The pinned CMake and the pinned Kotlin are the ones actually used, not
#      whatever the Android Gradle Plugin would have chosen on its own.
#   5. A debug APK and an unsigned release APK build from source, with the Core
#      linked into libomni_builder.so for every target ABI.
#   6. Two clean release builds produce a byte-identical APK.
#   7. Both APKs the build produces contain every class the manifest names.
#   8. Both APKs can actually be installed: native libraries stored and 16 KB
#      aligned, and, for the debug artifact, a signature the platform accepts.
#   9. The v2 content digest the Core recomputes is the one Google's apksigner
#      wrote, checked against a package apksigner signs during the test run.
#  10. The Core's signing reader reads the APK this build produced -- an Android
#      Gradle Plugin layout, not one the Core wrote -- and its digest holds.
#  11. The Core's DEX reader reads the classes.dex this build produced, and its
#      header fields and class list agree with dexdump.
#  12. The Core's class file reader reads every .class the Kotlin compiler
#      produced here, and agrees with javap on all of them.
#  13. aapt2 reads the binary XML the Core writes and agrees on every value,
#      and every attribute identifier the Core carries is the one aapt2 uses.
#  14. The Core's RSA signatures are byte-identical to OpenSSL's from the same
#      key, and OpenSSL verifies them.
#  15. An APK built and signed with nothing but this tree - no aapt2, no d8,
#      no apksigner, no library - is verified by apksigner under the v2 scheme.
#  16. The build engine generates its own key and certificate, enforces the
#      security policy, and produces a package apksigner verifies; a project
#      that fails the policy produces no package and leaves nothing behind.
#
# WHAT IT DOES NOT PROVE
# -----------------------------------------------------------------------------
# Nothing here runs the application on a device.
#
# The published artifact is the release APK, signed with the key held in the
# repository's OMNI_KEYSTORE_* secrets. No key material is in this repository
# and none ever will be (directive section 25): the keystore arrives as a
# secret, is written to the runner's temporary directory, and is never an
# input or an output of the build. When the secrets are absent the release is
# built unsigned and the job says so - an unsigned package cannot be installed,
# and pretending otherwise would be worse than saying it plainly.
#
# Nothing here produces a signature with Omni's own code. The Core reads and
# checks a signing block; it does not write one, and it never verifies the
# signature over the signed data (ADR-0010). Plugins/Sign.rs remains PLANNED.

name: Build and verify

on:
  push:
    branches:
      - Main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository. It publishes nothing and needs no more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrors the toolchain lock in Omni.rs. Changing a value here without changing
  # it there makes `verifyToolchainLock` fail, which is the point.
  OMNI_RUST_VERSION: "1.97.1"
  OMNI_JDK_VERSION: "25"
  OMNI_NDK_VERSION: "29.0.14206865"
  OMNI_BUILD_TOOLS_VERSION: "36.0.0"
  OMNI_ANDROID_API: "36"
  OMNI_CMAKE_VERSION: "4.4.2"
  # The Android SDK publishes CMake only up to 4.1.2, so the pinned version comes
  # from upstream Kitware and is verified against this checksum before it is used
  # (directive section 31, ADR-0005). Nothing is trusted for having downloaded.
  OMNI_CMAKE_SHA256: "3ada9a3f5d8a85413579bdd0ea6aa8e8da86efdd6d15c91a1afa517f2021956c"
  # Installed only to obtain a Ninja binary with clear provenance; the Kitware
  # archive does not ship one. This version is never used to configure a build.
  OMNI_SDK_CMAKE_FOR_NINJA: "4.1.2"

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        # keytool comes from the JDK, and the signing conformance tests use it to
        # make the key apksigner then signs with.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.OMNI_JDK_VERSION }}

      - name: Install the pinned build tools
        # The signing conformance tests check the Core's digest against the one
        # apksigner writes. Without apksigner they would skip, so it is installed
        # explicitly rather than assumed to be on the image.
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"
          "$sdkmanager" "build-tools;$OMNI_BUILD_TOOLS_VERSION"
          test -x "$ANDROID_HOME/build-tools/$OMNI_BUILD_TOOLS_VERSION/apksigner"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$OMNI_RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$OMNI_RUST_VERSION"
          rustc --version
          # The pin is not advisory. Cargo refuses to build below the
          # rust-version in Cargo.toml, so this failing means the lock is wrong.
          test "$(rustc --version | cut -d' ' -f2)" = "$OMNI_RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with warnings as errors
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run the Core test suite
        # A conformance test that skips reports success while checking nothing.
        # This makes a missing apksigner fail the job instead (see find_apksigner
        # in Omni.rs).
        env:
          OMNI_REQUIRE_APKSIGNER: "1"
        run: cargo test --locked

      - name: Confirm the Core carries no third-party dependency
        run: |
          set -euo pipefail
          # ADR-0003: the Core's supply-chain surface is meant to be empty, and a
          # dependency that arrives unnoticed is exactly what section 31 guards
          # against. Cargo.lock holds one package - the Core itself.
          packages=$(grep -c '^\[\[package\]\]' Cargo.lock)
          echo "Packages in Cargo.lock: $packages"
          test "$packages" -eq 1

  apk:
    name: Builder APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.OMNI_JDK_VERSION }}

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$OMNI_RUST_VERSION" --profile minimal
          rustup default "$OMNI_RUST_VERSION"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          rustc --version

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Not `yes | sdkmanager`. sdkmanager closes stdin once it has read the
          # answers it needs, `yes` dies of SIGPIPE, and under `pipefail` that
          # non-zero status fails the whole step even though the licences were
          # accepted. A here-string has no upstream process to kill, and it keeps
          # sdkmanager's own exit status meaningful.
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"

          "$sdkmanager" \
            "platforms;android-$OMNI_ANDROID_API" \
            "build-tools;$OMNI_BUILD_TOOLS_VERSION" \
            "ndk;$OMNI_NDK_VERSION" \
            "cmake;$OMNI_SDK_CMAKE_FOR_NINJA"

          test -d "$ANDROID_HOME/ndk/$OMNI_NDK_VERSION"

      - name: Provision the pinned CMake from upstream
        run: |
          set -euo pipefail
          archive="cmake-$OMNI_CMAKE_VERSION-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v$OMNI_CMAKE_VERSION/$archive"

          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "$OMNI_CMAKE_SHA256  $archive" | sha256sum --check --strict

          install --directory "$HOME/cmake-$OMNI_CMAKE_VERSION"
          tar --extract --gzip --file "$archive" \
            --directory "$HOME/cmake-$OMNI_CMAKE_VERSION" --strip-components=1

          # The Kitware archive ships no generator. Take the Ninja that Google
          # publishes with its own CMake package rather than pulling a third
          # binary from a third source.
          cp "$ANDROID_HOME/cmake/$OMNI_SDK_CMAKE_FOR_NINJA/bin/ninja" \
             "$HOME/cmake-$OMNI_CMAKE_VERSION/bin/ninja"

          reported=$("$HOME/cmake-$OMNI_CMAKE_VERSION/bin/cmake" --version | head -1)
          echo "$reported"
          test "$reported" = "cmake version $OMNI_CMAKE_VERSION"

      - name: Point the build at the provisioned toolchains
        run: |
          set -euo pipefail
          # local.properties is host-specific and deliberately not committed
          # (.gitignore), so the runner writes its own.
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$HOME/cmake-$OMNI_CMAKE_VERSION"
          } > local.properties
          cat local.properties

      - name: Provision the release signing key
        # The keystore is a secret, not a file in the repository. It is written
        # to the runner's temporary directory, which is destroyed with the job,
        # and the four values the build reads are exported from here. GitHub
        # masks registered secrets in logs; nothing below echoes them anyway.
        env:
          OMNI_KEYSTORE_BASE64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OMNI_KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets are configured."
            echo "The release APK will be built unsigned and cannot be installed."
            echo "Add OMNI_KEYSTORE_BASE64, OMNI_KEYSTORE_PASSWORD, OMNI_KEY_ALIAS"
            echo "and OMNI_KEY_PASSWORD as repository secrets to change that."
            exit 0
          fi

          store="$RUNNER_TEMP/omni-release.jks"

          # Two kinds of paste damage, both seen in practice, neither of
          # which base64 explains:
          #
          #   spaces          rejected outright - "base64: invalid input" and
          #                   nothing else to go on. Newlines it tolerates;
          #                   spaces it does not.
          #   a leading "="   the secret was copied together with a separator
          #                   line. "=" is padding and is only ever valid at
          #                   the end, so one at the front voids the lot.
          #
          # Stripping both is safe: a valid base64 value contains no
          # whitespace and never begins with padding.
          printf '%s' "$OMNI_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^=*//' \
            | base64 --decode > "$store"
          test -s "$store"

          # And prove it is actually the keystore before the build depends on
          # it. This is not belt-and-braces: a truncated paste *decodes without
          # complaint* into bytes that are not a keystore, so without this the
          # first sign of trouble would be an AGP error during signing, several
          # minutes later and far from the cause. keytool prints the certificate
          # to nowhere; nothing secret reaches the log.
          if ! keytool -list -keystore "$store" \
                -storepass "$OMNI_KEYSTORE_PASSWORD" \
                -alias "$OMNI_KEY_ALIAS" > /dev/null 2>&1; then
            decoded=$(wc -c < "$store")
            echo "OMNI_KEYSTORE_BASE64 did not decode into a usable keystore."
            echo
            echo "It decoded to $decoded bytes, which narrows it down:"
            echo
            echo "  Right size, still refused -> a character in the secret was"
            echo "  altered in transit. One is enough, and the result decodes to"
            echo "  the correct length, so size proves nothing. Re-copy the whole"
            echo "  value from the file it was delivered in rather than hunting"
            echo "  for the character."
            echo
            echo "  Wrong size -> the copy was partial, or it picked up text"
            echo "  around the value. A partial copy decodes without complaint."
            echo
            echo "  Either way, also confirm OMNI_KEYSTORE_PASSWORD and"
            echo "  OMNI_KEY_ALIAS belong to this key."
            exit 1
          fi

          # The certificate fingerprint is public and worth having in the log:
          # it is how you tell which key signed a given build.
          keytool -list -keystore "$store" \
            -storepass "$OMNI_KEYSTORE_PASSWORD" \
            -alias "$OMNI_KEY_ALIAS" 2>/dev/null | grep -i "fingerprint" || true

          {
            echo "OMNI_SIGNING_STORE_FILE=$store"
            echo "OMNI_SIGNING_STORE_PASSWORD=$OMNI_KEYSTORE_PASSWORD"
            echo "OMNI_SIGNING_KEY_ALIAS=$OMNI_KEY_ALIAS"
            echo "OMNI_SIGNING_KEY_PASSWORD=$OMNI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing is configured."

      - name: Verify the provisioned CMake
        run: ./gradlew :Builder:verifyCmakeToolchain --console=plain

      - name: Verify the toolchain lock
        run: ./gradlew verifyToolchainLock --console=plain

      - name: Verify the Kotlin toolchain
        run: ./gradlew :Builder:verifyKotlinToolchain --console=plain

      - name: Build the debug APK
        run: ./gradlew :Builder:assembleDebug --console=plain

      - name: Build the release APK
        run: ./gradlew :Builder:assembleRelease --console=plain

      - name: Confirm the Core is linked into every ABI
        run: |
          set -euo pipefail
          # The release artifact is named "-unsigned" only while no signing
          # identity is configured, so resolve it rather than assuming the name.
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          nm="$ANDROID_HOME/ndk/$OMNI_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          work=$(mktemp -d)
          unzip -q "$apk" -d "$work"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="$work/lib/$abi/libomni_builder.so"
            test -f "$so" || { echo "missing native library for $abi"; exit 1; }

            # The four JNI entry points and JNI_OnLoad, and nothing else. If the
            # Core's C ABI ever appears here, --exclude-libs has stopped working
            # and the shared object is exposing more than it should.
            exported=$("$nm" -D --defined-only "$so" | wc -l)
            echo "$abi: $exported exported symbols"
            test "$exported" -eq 5

            "$nm" -D --defined-only "$so" | grep -q Java_com_omni_builder_Builder_nativeStateReport
            ! "$nm" -D --defined-only "$so" | grep -q omni_state_report
          done

      - name: Verify the release APK is byte-reproducible
        run: |
          set -euo pipefail
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          first=$(sha256sum "$apk" | cut -d' ' -f1)

          ./gradlew clean --console=plain
          cargo clean
          ./gradlew :Builder:assembleRelease --console=plain

          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          second=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "build 1: $first"
          echo "build 2: $second"

          if [ "$first" != "$second" ]; then
            echo "The release APK is not reproducible (directive section 12)."
            exit 1
          fi
          echo "The release APK is byte-identical across clean rebuilds."

      - name: Restore the debug APK the reproducibility check removed
        # The step above runs `./gradlew clean` and then rebuilds only the
        # release artifact, so the debug APK is gone by the time the checks
        # below walk the output directory. They walk whatever is there and pass
        # on one APK as readily as two, which is how the debug APK stopped being
        # checked in CI without anything failing. The debug APK is the only one
        # that carries a signature, so its absence also silently skipped the
        # signature check - the very check added after "App not installed".
        run: |
          set -euo pipefail
          ./gradlew :Builder:assembleDebug --console=plain
          test -f Builder/build/outputs/apk/debug/Builder-debug.apk
          # Named "-unsigned" only while no signing identity is configured.
          ls Builder/build/outputs/apk/release/*.apk
          echo "Both APKs are present; the checks below will see both."

      - name: Verify that the APKs contain the code they declare
        run: ./gradlew :Builder:verifyApkClasses --console=plain --rerun-tasks

      - name: Verify that the APKs can be installed
        run: ./gradlew :Builder:verifyApkInstallability --console=plain --rerun-tasks

      - name: Build and sign a package with nothing but the Core
        # The milestone of phase 9: an APK whose manifest, container, content
        # digest, RSA signature and certificate handling all come from this
        # tree, handed to Google's apksigner for judgement. No aapt2, no d8,
        # no apksigner and no third-party library took part in making it.
        env:
          OMNI_REQUIRE_SELF_BUILT_APK: "1"
          OMNI_REQUIRE_RSA_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          cargo test --locked omni_builds_and_signs -- --nocapture
          cargo test --locked a_signature_this_build -- --nocapture
          cargo test --locked the_build_engine_produces -- --nocapture
          cargo test --locked the_path_the_application_takes -- --nocapture
          cargo test --locked the_security_policy_refuses -- --nocapture

      - name: Read the classes this build produced with the Core's own reader
        # Every class file the Kotlin compiler just produced, compared field for
        # field with javap: version, name, superclass, interfaces, fields,
        # methods, constant pool size and the Kotlin metadata version.
        env:
          OMNI_REQUIRE_CLASS_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          cargo test --locked every_class_this_build_produced -- --nocapture

      - name: Read the DEX this build produced with the Core's own reader
        # Reading a format correctly is not something a self-consistent parser
        # can establish about itself. This checks the Core's header fields and
        # class list against dexdump on the classes.dex the build just made,
        # and fails rather than skips if either side is missing.
        env:
          OMNI_REQUIRE_DEX_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          cargo test --locked the_dex_this_build_produced -- --nocapture

      - name: Read the signed APK with the Core's own signing reader
        # The Core's conformance tests sign an archive the Core itself wrote.
        # This points the same reader at a package the Android Gradle Plugin
        # laid out and apksigner signed, which is a different shape entirely.
        run: |
          set -euo pipefail
          # Prefer the release artifact: it is the deliverable, and a large RSA
          # signing key makes it SHA-512 signed, which the debug key does not
          # exercise. Fall back to the debug APK when no signing key is set,
          # because an unsigned package has no block to read.
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          case "$apk" in
            *-unsigned.apk) apk=Builder/build/outputs/apk/debug/Builder-debug.apk ;;
          esac
          echo "Reading $apk"
          OMNI_PACKAGE_UNDER_TEST="$apk" \
            cargo test --locked the_package_this_build_produced -- --nocapture

      - name: Report what the release artifact is
        run: |
          set -euo pipefail
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          echo "Release artifact: $(basename "$apk")"
          echo "SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/$OMNI_BUILD_TOOLS_VERSION/apksigner" verify \
            --print-certs "$apk" || {
              echo
              echo "This artifact is NOT signed and cannot be installed."
              echo "Add the OMNI_KEYSTORE_* repository secrets to get a signed one."
            }

      - name: Publish the release APK
        # The release artifact is the deliverable. The debug APK is built and
        # checked above but not published: it carries the shared debug key, so
        # it is a development build and not something to hand anyone.
        uses: actions/upload-artifact@v5
        with:
          name: omni-builder-release
          path: Builder/build/outputs/apk/release/*.apk
          if-no-files-found: error
