[package]
name          = "omni_core"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.97.1"
publish       = false
description   = "Omni_Builder Core — build graph, capability security and toolchain infrastructure"
license       = "MIT"

[lib]
name       = "omni_core"
path       = "Omni.rs"
crate-type = ["staticlib", "lib"]

[dependencies]

[profile.release]
opt-level       = "s"
lto             = true
codegen-units   = 1
strip           = "symbols"
overflow-checks = true

panic = "unwind"
