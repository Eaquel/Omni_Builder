# Omni_Builder — Gradle wrapper configuration
#
# LOCATION NOTE: directive section 46 places this file and gradle-wrapper.jar
# directly in Gradle/, not in the conventional gradle/wrapper/. GradleWrapperMain
# resolves the properties file relative to the jar, so this works as long as the
# two stay together. The gradlew launcher at the repository root points at the
# jar in this directory.
#
# SUPPLY CHAIN (directive section 31): distributionSha256Sum is not optional
# here. Without it the wrapper would execute whatever it downloaded. The value
# below is the checksum Gradle publishes for this exact distribution, and it is
# mirrored in the Core's toolchain lock in Omni.rs.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
