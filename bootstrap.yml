name: Bootstrap Omni_Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create files and directories
        run: |
          set -e
          mkdir -p app/src/main/java/com/omni/builder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/cpp
          mkdir -p scripts
          mkdir -p .github/workflows

          cat > README.md <<'EOF'
# Omni_Builder

Omni_Builder is an on-device APK generator app: users can pick a template (HTML WebView or native Kotlin), set application name, package name, ABI targets (32/64-bit), provide or create a keystore, and generate a ready-to-build Android project. The repo includes a Termux-friendly build script to install SDK/NDK/CMake and build the generated project with Gradle 9.6.1 and Java 25.

Important defaults in this repo:
- minSdkVersion: 29
- targetSdkVersion: 36
- Gradle version: 9.6.1 (gradle wrapper recommended)
- CMake: 4.4.1 (CMake used in generated project if native selected)
- Java: 25 (the build-on-device script expects a JDK 25 install; Actions will attempt to use Java 25)
EOF

