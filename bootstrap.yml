          cat > scripts/create_keystore.sh <<'EOF'
#!/usr/bin/env bash
set -e
KEYSTORE_FILE=${1:-release-keystore.jks}
ALIAS=${2:-key0}
read -p "Store password: " -s STOREPASS; echo
read -p "Key password (enter to use store password): " -s KEYPASS; echo
if [ -z "$KEYPASS" ]; then KEYPASS=$STOREPASS; fi
keytool -genkeypair -alias $ALIAS -keyalg RSA -keysize 4096 -validity 10000 -keystore $KEYSTORE_FILE -storepass $STOREPASS -keypass $KEYPASS -dname "CN=Omni Builder, OU=Dev, O=Omni, L=City, ST=State, C=US"
EOF

          cat > scripts/ci-run-wrapper.sh <<'EOF'
#!/usr/bin/env bash
set -e
gradle wrapper --gradle-version 9.6.1 || true
chmod +x ./gradlew || true
./gradlew assembleDebug || true
EOF

          cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: gradle wrapper --gradle-version 9.6.1 || true
      - run: ./gradlew assembleDebug || true
EOF

      - name: Commit and push created files
        run: |
          git config user.name "Omni Bootstraper"
          git config user.email "actions@github.com"
          git add --all
          git commit -m "Bootstrap: add Omni_Builder initial files" || echo "No changes to commit"
          git push
