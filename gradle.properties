# Omni_Builder — Gradle properties
#
# FILE NAME NOTE (ADR-0001 in Omni.rs): directive section 46 spells this file
# "Gradle.properties". Gradle reads only "gradle.properties".

# Mobile-first (directive section 36): the build host is not assumed to have
# unlimited memory. 2 GB is enough for this project and keeps the daemon from
# taking a machine over.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Deterministic behaviour (directive section 12).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is not used by this module - it carries no third-party dependency at
# all - but AGP requires the flag to be set explicitly rather than inferred.
android.useAndroidX=true

# Generating only what is used is configured per module, in the `buildFeatures`
# block of Builder/build.gradle.kts. The android.defaults.buildfeatures.* project
# properties are not used here: AGP 9 removed or deprecated them, and carrying a
# property the tool no longer honours is worse than carrying none, because it
# reads as a setting that is in force when it is not.

# Kotlin compiles inside the Gradle daemon rather than spawning a second JVM.
# One less JVM matters on a constrained machine (directive section 36), and this
# project is small enough that the isolation a separate process would buy is not
# worth the memory it costs.
kotlin.compiler.execution.strategy=in-process
